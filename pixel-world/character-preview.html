<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questvale · Character comparison</title><link rel="stylesheet" href="character-preview.css"></head>
<body><main><header><h1>Character comparison</h1><p>Boy · Girl · Robot · Mushroom — original artwork, synchronized steps, equal front idle height.</p></header>
<section class="toolbar" aria-label="Preview controls"><label>Direction <select id="direction"><option value="0">Down ↓</option><option value="1">Left ←</option><option value="2">Right →</option><option value="3">Up ↑</option><option value="4">Up-left ↖</option><option value="5">Up-right ↗</option><option value="6">Down-left ↙</option><option value="7">Down-right ↘</option></select></label><button id="play" aria-pressed="true">Pause</button><label>Frame <input id="frame" type="range" min="0" max="3" value="0"></label><label>Backdrop <select id="backdrop"><option value="grass">Grass</option><option value="paper">Parchment</option><option value="dark">Dark</option></select></label></section>
<p id="status" role="status">Loading four source sheets…</p><div class="stage"><canvas id="focus" width="1000" height="260" aria-label="Four characters side by side in the selected direction"></canvas></div>
<h2>All eight directions</h2><p>Scale stays fixed within each direction; feet and head centers stay registered. No recoloring, sharpening or redraw.</p><div class="stage"><canvas id="all" width="1000" height="1160" aria-label="Eight rows of synchronized character animations for style comparison"></canvas></div><p><a href="town.html">Back to town</a></p></main><script type="module" src="character-preview.mjs"></script></body></html>
