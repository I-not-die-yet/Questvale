<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Questvale · Explore the workshop</title><link rel="stylesheet" href="approved.css"><link rel="stylesheet" href="explore.css"></head>
<body><main class="town" data-mode="explore">
<canvas tabindex="0" aria-label="Questvale. Move using WASD or arrow keys. Approach the workshop and press E."></canvas>
<header class="explore-header"><div class="brand">Questvale<small>Find your next chapter</small></div><div class="actions"><button class="overview" aria-pressed="false">View route</button><button class="hotspot advisor" aria-label="Open AI Advisor">AI Advisor</button></div></header>
<span class="location">Central square</span>
<button class="hotspot workshop" aria-label="Explore Hackathon maker workshop">Hackathon</button>
<button class="hotspot entrance" aria-label="Enter Hackathon maker workshop" hidden>Workshop entrance</button>
<button class="hotspot board" aria-label="View all opportunities at the public noticeboard">All opportunities</button>
<button class="interaction" hidden><kbd>E</kbd><span>Explore Hackathon</span></button>
<footer class="controls"><span><kbd>WASD</kbd> / arrows · Move</span><span><kbd>E</kbd> Interact</span><span><kbd>Esc</kbd> Close</span></footer>
<div class="touch-controls" aria-label="Touch movement"><button data-direction="up" tabindex="-1" aria-label="Move north">↑</button><button data-direction="left" tabindex="-1" aria-label="Move west">←</button><button data-direction="down" tabindex="-1" aria-label="Move south">↓</button><button data-direction="right" tabindex="-1" aria-label="Move east">→</button></div>
<p class="loading" role="status">Opening the town…</p>
<dialog aria-labelledby="panel-title"><button class="close" aria-label="Close panel">×</button><div class="panel-content"></div></dialog><p class="sr" aria-live="polite" id="selection-status">No category selected.</p>
</main><script type="module" src="explore.mjs"></script></body></html>
